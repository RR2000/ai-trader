# The simulations the site runs. Read once at start-up and checked: a mistake stops the service with a message
# that names the simulation and the field (the tests check this file too, so CI catches it first).
#
# To add one: copy a [[simulation]] block, give it a new id and deploy. It starts from its first candle with
# its own cash and is compared with buy and hold from that same moment.
# Once a simulation has started, its strategy, params, symbol, interval, start_cash and fee are fixed: changing
# them stops it (the page says so). Use a new id instead. name and description can change at any time.
# Removing a block hides the simulation; its history stays in the database.
#
# Keys: id (lowercase letters, digits, dashes; it is the page address /s/<id>), name, description,
# strategy (dqn, mlp, sma-cross, rsi, bollinger, dca, buy-and-hold), params (see README), and optionally
# symbol, interval, start_cash, fee, which otherwise come from [defaults].

[defaults]
symbol = "BTCUSDT"     # any Binance spot pair: the quote currency is the cash (USDT here)
interval = "1m"        # candle length: 1m 3m 5m 15m 30m 1h 2h 4h 6h 8h 12h 1d
start_cash = 1000      # in the quote currency
fee = 0.001            # 0.1% per trade, Binance's base spot rate

[[simulation]]
id = "dqn-2023"
name = "DQN 2023"
description = "The deep Q-network trained in April 2023 on one-minute candles. The original live demo, unchanged."
strategy = "dqn"
interval = "1m"
[simulation.params]
model = "trading_model_episode_30.h5"

[[simulation]]
id = "mlp-2026"
name = "Neural network 2026"
description = "A small network trained in 2026 on years of hourly candles and tested walk-forward. Its test results are in the README."
strategy = "mlp"
interval = "1h"
[simulation.params]
model = "mlp_btcusdt_1h_2026-10.npz"
enter = 0.55
leave = 0.45

[[simulation]]
id = "buy-and-hold"
name = "Buy and hold"
description = "Buys once at the start and never sells: the plain reference."
strategy = "buy-and-hold"
interval = "15m"

[[simulation]]
id = "sma-cross-20-50"
name = "SMA crossover 20/50"
description = "Trend following: holds BTC while the 20-hour average is above the 50-hour one."
strategy = "sma-cross"
interval = "1h"
[simulation.params]
fast = 20
slow = 50

[[simulation]]
id = "rsi-14"
name = "RSI 14, 30/70"
description = "Mean reversion: buys when the 15-minute RSI says oversold, sells when it says overbought."
strategy = "rsi"
interval = "15m"
[simulation.params]
period = 14
oversold = 30
overbought = 70

[[simulation]]
id = "bollinger-20-2"
name = "Bollinger Bands 20/2"
description = "Mean reversion: buys below the lower band, sells above the upper band, on 15-minute candles."
strategy = "bollinger"
interval = "15m"
[simulation.params]
period = 20
width = 2.0

[[simulation]]
id = "dca-daily"
name = "Daily DCA"
description = "Buys 25 USDT of BTC every day, whatever the price, and never sells."
strategy = "dca"
interval = "1h"
[simulation.params]
amount = 25
every = "1d"
