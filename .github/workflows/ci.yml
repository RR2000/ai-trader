name: CI

# PR e main: test (inferenza contro Keras, osservazione contro ta/scikit-learn, contabilita', persistenza
# su un PostgreSQL vero) e build dell'immagine. Solo su main l'immagine va su GitHub Container Registry:
# ghcr.io/rr2000/ai-trader, :sha-<commit> e :main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      REQUIRE_POSTGRES: "1"
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --no-deps -r requirements-dev.txt && pip check
      - run: python -m pytest -q -rs

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/rr2000/ai-trader:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/ai-trader:main
          labels: |
            org.opencontainers.image.source=https://github.com/RR2000/ai-trader
            org.opencontainers.image.description=Paper trading with a 2023 deep Q-network on live BTC/USDT prices
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prova dell'immagine (PR)
        if: github.event_name != 'push'
        run: |
          docker image ls ghcr.io/rr2000/ai-trader:main --format 'dimensione: {{.Size}}'
          docker run --rm --memory 192m ghcr.io/rr2000/ai-trader:main python -c \
            "from trader.model import QNetwork; import numpy as np; n = QNetwork('/app/model/trading_model_episode_30.h5'); print('q', n.q_values(np.full((30, 7), .5)))"
